server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # .webmanifest isn't in every nginx mime.types; serve it with the right type.
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Icons rarely change.
    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Everything else: let the iPad check for a newer copy each load (cheap on a home network),
    # so word-list edits and code updates show up right away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
