# Shared by the http (2021) and https (2022) servers.
root /usr/share/nginx/html;
index index.html;

# .webmanifest isn't in every nginx mime.types; serve it with the right type.
location ~ \.webmanifest$ {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
}

# Natural voice: forwarded to the Piper text-to-speech container.
# Resolved per request (Docker's DNS), so nginx still starts if that container is down;
# the games then fall back to the iPad's built-in voice.
location /tts {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $tts http://tts:5000;
    proxy_pass $tts;
    proxy_read_timeout 30s;
}

# Progress backup and saved pictures: the "save" container.
location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $save http://save:5001;
    proxy_pass $save;
    client_max_body_size 30m;
    proxy_read_timeout 30s;
}

# The home certificate, for the iPad to trust the secure address (see Grown-ups).
location = /lydias-games-ca.crt {
    alias /certs/ca.crt;
    default_type application/x-x509-ca-cert;
    add_header Cache-Control "no-cache";
}

# Icons rarely change.
location /icons/ {
    add_header Cache-Control "public, max-age=604800";
}

# Everything else: let the iPad check for a newer copy each load (cheap on a home network),
# so word-list edits and code updates show up right away.
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
}
