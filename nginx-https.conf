# The secure address, https://<this computer>:2022. Needed for the microphone (Say It game).
# Removed at startup if there are no certificates yet (see wait-for-certs.sh).
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    include /etc/nginx/site.conf;
}
